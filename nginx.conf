server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # SPA: qualquer rota desconhecida cai no index.html (react-router resolve no cliente).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # O service worker nao pode ser cacheado, senao o PWA trava numa versao antiga.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
