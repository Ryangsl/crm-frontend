# CI do frontend: install -> lint -> testes (Vitest) -> build; e auditoria das dependencias de producao.
#
# D-021/D-052 (`PROPOSTO`): GitHub Actions, um workflow por repositorio. Se a hospedagem mudar,
# troca-se este arquivo sem alterar a estrategia de testes de
# crm-spec/docs/09-testing/testing-strategy.md.
#
# Os testes do frontend nao usam banco nem API reais (a API e simulada). Os e2e da API rodam no CI do
# crm-backend. Os e2e de navegador (Playwright, D-020, pasta e2e/) precisam da API real, que e de um
# repositorio privado: rodam no job `browser-e2e` do CI do crm-backend, que baixa este repositorio. Aqui
# a pasta e2e/ so passa por lint e tipos (o build roda o tsc, que a inclui).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uma execucao por ref. Em PR, um push novo cancela a anterior; no main, nenhuma e cancelada.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frontend:
    name: build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Falha com vulnerabilidade alta ou critica em dependencia de producao (D-090).
      - name: npm audit (producao)
        run: npm audit --omit=dev --audit-level=high
