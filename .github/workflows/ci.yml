# CI da Fase 1: install -> lint -> test -> build.
#
# D-021 (`PROPOSTO`): GitHub Actions e a direcao, nao uma decisao fechada. Se a hospedagem
# mudar (GitLab/Bitbucket), troca-se este arquivo sem alterar a estrategia de testes de
# crm-spec/docs/09-testing/testing-strategy.md.
#
# Escopo desta fase: teste unitario e build. Integracao/e2e (que exigem Postgres e Redis)
# entram na Fase 2 junto do primeiro fluxo real.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: build e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
